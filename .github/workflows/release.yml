name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: Build and package
        run: |
          mkdir -p dist
          go build -trimpath -o dist/gotel ./cmd/gotel
          go build -trimpath -o dist/gotel-mcp ./cmd/gotel-mcp
          cp LICENSE README.md dist/
          tar -czf "gotel-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.tar.gz" -C dist \
            gotel gotel-mcp LICENSE README.md
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: "*.tar.gz"
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --generate-notes \
            *.tar.gz SHA256SUMS
